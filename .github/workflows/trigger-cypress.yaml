name: Comment Triggered Workflow

on:
  issue_comment:
    types:
      - created
      - edited

jobs:
  comment_triggered_job:
    runs-on: ubuntu-latest

    steps:
      - name: Check Comment
        id: check_comment
        run: |
          if [[ "${{ github.event.comment.body }}" == "Comment" ]]; then
          echo "Comment matches, proceeding to run Cypress."
          echo "RUN_CYPRESS=true" >> $GITHUB_ENV
          else
          echo "Comment does not match, skipping Cypress run."
          echo "RUN_CYPRESS=false" >> $GITHUB_ENV
          fi

      - name: Trigger Workflow
        if: steps.check_comment.outputs.trigger_workflow == 'true'
        run: echo "The comment matches, triggering the workflow."