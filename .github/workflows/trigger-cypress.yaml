name: Comment Triggered Workflow

on:
  issue_comment:
    types:
      - created
      - edited

jobs:
  comment_triggered_job:
    runs-on: ubuntu-latest

    steps:
      - name: Check Comment
        id: check_comment
        run: |
          comment_body="${{ github.event.comment.body }}"
          if [[ "$comment_body" =~ TEST:(.*?)end ]]; then
            specs="${BASH_REMATCH[1]}"
            echo "Specs to test: $specs"
            # Split the content by commas and remove spaces
            IFS=',' read -ra content_array <<< "$specs"
            content_array=("${content_array[@]// /}")  # Remove spaces from all elements
            # Add "cypress/e2e/" prefix to each element
            for ((i=0; i<${#content_array[@]}; i++)); do
            content_array[$i]="cypress/e2e/${content_array[$i]}"
            done
            # Join the content array elements with commas
            content_no_spaces="$(IFS=','; echo "${content_array[*]}")"
            echo "Extracted content: $content_no_spaces"
          else
            echo "Comment does not match the expected format."
            exit 1
          fi

      - name: Trigger Workflow
        run: |
          if [[ -n "$TEST_SPECS" ]]; then
            echo "The comment matches, triggering the workflow with directories: $TEST_SPECS."
          else
            echo "No directories specified, exiting with an error."
            exit 1
          fi